
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteador de Nomes Premium</title>
    <style>
        /* --- ESTILIZAÇÃO (CSS) --- */
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --background: #0f172a;
            --surface: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--surface);
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
            color: var(--text);
        }

        p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 1rem;
            text-align: left;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 12px;
            background-color: #0f172a;
            border: 2px solid #334155;
            border-radius: 8px;
            color: var(--text);
            resize: none;
            font-size: 1rem;
            margin-bottom: 1.5rem;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
            margin-bottom: 1.5rem;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            background-color: #475569;
            cursor: not-allowed;
        }

        /* Resultado do Sorteio */
        .result-container {
            margin-top: 1rem;
            padding: 1.5rem;
            background: rgba(16, 185, 129, 0.1);
            border: 2px dashed var(--accent);
            border-radius: 8px;
            display: none;
            animation: fadeIn 0.5s ease-out;
        }

        .result-title {
            color: var(--accent);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }

        .winner-name {
            font-size: 2rem;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
        }

        /* Animação simples de surgimento */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎉 Sorteador 
       
            
            
        
        <p>Insira os nomes dos participantes (um por linha ou separados por vírgula):</p>
        <textarea id="namesInput" placeholder="Ex: João, Maria, Pedro&#10;Ana&#10;Carlos"></textarea>
        
        <button id="drawBtn" onclick="sortear()">Sortear Ganhador</button>

        <div id="resultContainer" class="result-container">
            <div class="result-title">🏆 O Ganhador é:</div>
            <div id="winner" class="winner-name"></div>
        </div>
    </div>

    <script>
        // --- LÓGICA DO SORTEIO (JAVASCRIPT) ---
        function sortear() {
            const input = document.getElementById('namesInput').value;
            const btn = document.getElementById('drawBtn');
            const resultContainer = document.getElementById('resultContainer');
            const winnerDisplay = document.getElementById('winner');

            // Divide o texto por quebras de linha ou vírgulas, remove espaços extras e filtra linhas vazias
            const participantes = input
                .split(/[\n,]+/)
                .map(nome => nome.trim())
                .filter(nome => nome !== "");

            // Validação: verifica se há participantes suficientes
            if (participantes.length === 0) {
                alert("Por favor, insira pelo menos um nome para realizar o sorteio.");
                return;
            }

            // Desativa o botão temporariamente para dar efeito de "carregamento"
            btn.disabled = true;
            btn.innerText = "Sorteando...";
            resultContainer.style.display = "none";

            // Efeito de suspense simulado com setTimeout (1 segundo)
            setTimeout(() => {
                // Gera um índice aleatório baseado no tamanho do array
                const indiceAleatorio = Math.floor(Math.random() * participantes.length);
                const ganhador = participantes[indiceAleatorio];

                // Exibe o resultado na tela
                winnerDisplay.innerText = ganhador;
                resultContainer.style.display = "block";

                // Reativa o botão
                btn.disabled = false;
                btn.innerText = "Sortear Ganhador";
            }, 1000);
        }
    </script>

</body>
</html>
